name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rules:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      # Analysis tests plus real codegen (schema, operations, per-schema version pin).
      - run: bazel test //...

  example:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      # Generates, compiles and runs three Swift modules against ApolloAPI.
      - run: bazel test //...
        working-directory: examples/animal_kingdom

  rick_and_morty:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      # Codegen, the iOS app, and the feature tests on the simulator.
      - run: bazel test //... --test_output=errors
        working-directory: examples/rick_and_morty
      # The Xcode project generates and builds through Bazel.
      - run: |
          bazel run //:xcodeproj
          xcodebuild -project RickAndMorty.xcodeproj -scheme RickAndMorty \
            -destination 'generic/platform=iOS Simulator' build
        working-directory: examples/rick_and_morty
